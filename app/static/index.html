<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f8">
    <title>Resumo de PDF</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        color: #17212b;
        background: #f4f6f8;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 18px;
      }

      main {
        width: min(100%, 680px);
        padding: 38px;
        border: 1px solid #e1e6eb;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 55px rgb(22 42 63 / 8%);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #126b57;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 { margin: 0; font-size: clamp(28px, 5vw, 38px); letter-spacing: -.04em; }
      .intro { margin: 12px 0 28px; color: #5c6874; line-height: 1.6; }
      label { display: block; margin: 20px 0 8px; font-size: 14px; font-weight: 700; }

      input[type="file"], textarea {
        width: 100%;
        border: 1px solid #cfd7df;
        border-radius: 10px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      input[type="file"] { padding: 12px; }
      textarea { min-height: 120px; padding: 13px 14px; resize: vertical; line-height: 1.5; }
      input:focus-visible, textarea:focus-visible, button:focus-visible {
        outline: 3px solid rgb(18 107 87 / 25%);
        outline-offset: 2px;
        border-color: #126b57;
      }

      .hint { margin: 7px 0 0; color: #687581; font-size: 13px; }
      fieldset { margin: 22px 0 12px; padding: 0; border: 0; }
      legend { margin-bottom: 10px; font-size: 14px; font-weight: 700; }
      textarea:disabled { background: #f1f3f5; color: #687581; cursor: not-allowed; }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 14px 18px;
        border: 0;
        border-radius: 10px;
        background: #126b57;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover:not(:disabled) { background: #0d5848; }
      button:disabled { cursor: wait; opacity: .65; }
      #message { min-height: 24px; margin: 16px 0 0; line-height: 1.5; }
      #message[data-kind="error"] { color: #b42318; }
      #message[data-kind="success"] { color: #126b57; }

      @media (max-width: 520px) {
        main { padding: 26px 20px; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Resumo de PDF</p>
      <h1>Gere um resumo do seu PDF</h1>
      <p class="intro">Escolha se deseja resumir o PDF inteiro ou priorizar uma sentença orientadora.</p>

      <form id="summary-form">
        <label for="file">Arquivo PDF</label>
        <input id="file" name="file" type="file" accept=".pdf,application/pdf" required>
        <p class="hint">PDFs digitalizados sem texto selecionável não são processados.</p>

        <fieldset>
          <legend>Como deseja resumir?</legend>
          <label class="choice"><input type="radio" name="summary_mode" value="guided" checked> Resumo por sentença orientadora</label>
          <label class="choice"><input type="radio" name="summary_mode" value="whole"> Resumo do PDF inteiro</label>
        </fieldset>

        <div id="sentence-group">
          <label for="sentence">Sentença orientadora</label>
          <textarea id="sentence" name="sentence" maxlength="2000" placeholder="Ex.: Quais são as principais conclusões do estudo?" required></textarea>
          <p class="hint">No modo orientado, a sentença deve aparecer no texto do PDF.</p>
        </div>



        <button id="submit" type="submit">Gerar resumo em Word</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script>
      const form = document.querySelector("#summary-form");
      const fileInput = document.querySelector("#file");
      const sentenceInput = document.querySelector("#sentence");
      const sentenceGroup = document.querySelector("#sentence-group");
      const modeInputs = [...document.querySelectorAll('input[name="summary_mode"]')];
      const submitButton = document.querySelector("#submit");
      const message = document.querySelector("#message");
      let processing = false;

      function updateFormControls() {
        fileInput.disabled = processing;
        sentenceInput.disabled = processing || selectedMode() !== "guided";
        modeInputs.forEach((input) => { input.disabled = processing; });
        submitButton.disabled = processing;
      }

      function selectedMode() {
        return modeInputs.find((input) => input.checked).value;
      }

      function updateMode() {
        const guided = selectedMode() === "guided";
        sentenceGroup.hidden = !guided;
        sentenceInput.required = guided;
        sentenceInput.disabled = processing || !guided;
      }

      function setMessage(text, kind = "") {
        message.textContent = text;
        message.dataset.kind = kind;
      }

      function filenameFromResponse(response, originalName) {
        const disposition = response.headers.get("Content-Disposition") || "";
        const encoded = disposition.match(/filename\*=UTF-8''([^;]+)/i);
        if (encoded) {
          try { return decodeURIComponent(encoded[1]); } catch (_) { /* use fallback */ }
        }
        const stem = originalName.replace(/\.pdf$/i, "");
        return `${stem}_1.docx`;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = fileInput.files[0];
        const sentence = sentenceInput.value.trim();
        const mode = selectedMode();

        if (!file) {
          setMessage("Selecione um arquivo PDF.", "error");
          return;
        }
        if (!file.name.toLowerCase().endsWith(".pdf")) {
          setMessage("O arquivo selecionado precisa ter extensão .pdf.", "error");
          return;
        }
        if (mode === "guided" && !sentence) {
          setMessage("Digite a sentença que deseja procurar.", "error");
          return;
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("summary_mode", mode);
        if (mode === "guided") formData.append("sentence", sentence);
        processing = true;
        updateFormControls();
        setMessage("Lendo o PDF e preparando o resumo em Word...");

        try {
          const response = await fetch("/tasks", { method: "POST", body: formData });
          if (!response.ok) {
            let detail = "Não foi possível processar o PDF.";
            try {
              const body = await response.json();
              if (body.detail) detail = body.detail;
            } catch (_) { /* keep default message */ }
            throw new Error(detail);
          }

          const blob = await response.blob();
          const downloadUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = downloadUrl;
          link.download = filenameFromResponse(response, file.name);
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(downloadUrl);
          setMessage(`Arquivo Word gerado: ${link.download}`, "success");
        } catch (error) {
          setMessage(error.message || "Erro ao gerar o resumo.", "error");
        } finally {
          processing = false;
          updateFormControls();
        }
      });

      modeInputs.forEach((input) => input.addEventListener("change", updateMode));
      updateMode();
      updateFormControls();
    </script>
  </body>
</html>
